services:
  dex-art-tracker:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Most requests the server may send to TCGdex per day. 0 = no limit (default).
      # DAILY_REQUESTS: "0"
      # Pause between two requests, in milliseconds (default 2000 = 2 seconds).
      # REQUEST_DELAY_MS: "2000"
      # Prices of the cheapest art cards are re-checked when older than this many days.
      PRICE_MAX_AGE_DAYS: "30"
      # The set list is checked for new sets when the container starts and then this often (days).
      # SETS_CHECK_DAYS: "1"
      # How many of the cheapest art cards per Pokémon are kept up to date.
      PRICE_CANDIDATES: "2"
      # Only sets released on or after this date (YYYY-MM-DD) are read; "any" reads every set, back to the 1999 Base Set.
      MIN_SET_DATE: "any"
      # Set to "1" so even the first build of the database is limited to DAILY_REQUESTS per day (needs DAILY_REQUESTS to be set).
      # STAGGER_INITIAL: "1"
      # Every Pokémon card from a promo set counts as an art card. Set to "0" to turn that off.
      # PROMO_AS_ART: "1"
      # Which rarities count as art cards (compared without upper/lower case).
      # RARITIES: "Illustration Rare,Special Illustration Rare,Promo"
      # Card pictures are stored in the data volume (roughly 3-5 GB). "0" turns that off.
      # IMAGE_CACHE: "1"
      # High resolution copies: "all" (default), "art" (art, owned and wished cards, about 1-1.5 GB in all) or "none".
      # IMAGE_HIGH: "all"
      # Missing card pictures (mostly promos) are looked up on pokemontcg.io. "0" turns that off.
      # PICTURE_LOOKUP: "1"
      # PICTURES_PER_DAY: "500"
      # Prices shown on the page: "cardmarket" (euro, default) or "tcgplayer" (dollar).
      # PRICE_SOURCE: "cardmarket"
      # The admin password (log in on http://<address>:8080/admin/, the only place for it). Without it a random
      # one is generated and printed in the container log (also saved as admin.json in the data folder). The admin adds
      # the trainers' accounts and changes the settings on the page. Without this setting it can also change the password there.
      # Most settings below can also be chosen on the Admin settings page, which wins over what is written here.
      # ADMIN_PASSWORD: "choose-a-long-password"
      # The Android app download (website button and the app's update check): 0 = off. ANDROID_RELEASE is the folder
      # with dex-art.apk and version.json (default: the android-latest release of the GitHub repository).
      # ANDROID_APP: "1"
      # Set to "1" so visitors who are not logged in also see "worth" and "left to spend".
      # SHOW_VALUE_PUBLIC: "1"
      # On by default: logins use the visitor's real address from the reverse proxy (X-Forwarded-For).
      # Set to "0" if the page is reached directly, without a proxy in front.
      # Number of reverse proxies in a row in front of the server (the visitor's address is read from the end of X-Forwarded-For).
      # PROXY_HOPS: "1"
      # Card scanning in the app (reads the card with Tesseract on this server). "0" switches it off.
      # SCAN: "1"
      # Let an AI read the cards (much better than the built-in reader): gemini, openai, claude, mistral, openrouter or local.
      # SCAN_AI: "gemini"
      # SCAN_AI_KEY: "your-api-key"
      # SCAN_AI_MODEL: "gemini-flash-latest"
      # SCAN_AI_BACKUP_MODEL: "gemini-flash-lite-latest"   # used when the main model is busy
      # For a local model (Ollama, LM Studio, llama.cpp), the address including /v1:
      # SCAN_AI_URL: "http://host.docker.internal:11434/v1"
      # TRUST_PROXY: "0"
      # Extra rarities that count as art cards in every language (Japanese cards numbered above the set size always count too).
      # EXTRA_RARITIES: "Mega Hyper Rare,Ultra Rare,Holo Rare"
    volumes:
      - dex-data:/data
    restart: unless-stopped

volumes:
  dex-data:
