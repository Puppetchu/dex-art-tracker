# Builds the Android app (android/dist/dex-art.apk) on every change to android/, or by hand from the Actions tab.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_B64   the signing key file (dex-art-signing-key.jks) as base64 text
#   ANDROID_KEYSTORE_PASS  its password
# Every build must use the same key, otherwise phones refuse to install the update over the old app.
name: Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version code is the number of commits

      - name: Android build tools (Ubuntu packages)
        run: sudo apt-get update -q && sudo apt-get install -y -q android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASS secrets first (see android/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dex-art.jks"

      - name: Build
        env:
          KEYSTORE: ${{ runner.temp }}/dex-art.jks
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VERSION_NAME: '1.0'
        run: bash android/build.sh # bash: works even when the file lost its run permission in an upload

      - uses: actions/upload-artifact@v4
        with:
          name: dex-art-apk
          path: android/dist/dex-art.apk
