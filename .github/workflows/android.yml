# Builds the Android app (android/dist/dex-art.apk) on every change to android/, or by hand from the Actions tab,
# and publishes it as the GitHub release "android-latest" (dex-art.apk + version.json). The website's "Android app"
# button and the app's own update check use that release (the ANDROID_RELEASE setting of the server).
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_B64   the signing key file (dex-art-signing-key.jks) as base64 text
#   ANDROID_KEYSTORE_PASS  its password
# Every build must use the same key, otherwise phones refuse to install the update over the old app.
name: Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write # to publish the release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # a normal run takes about 2 minutes; never hang for hours
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version code is the number of commits

      - name: Android build tools (Ubuntu packages)
        timeout-minutes: 12
        run: |
          # Ubuntu's package mirror sometimes stalls: give up on a hanging download quickly and try again
          APT="-q -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for try in 1 2 3; do
            if sudo apt-get update $APT && sudo apt-get install -y $APT android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner; then exit 0; fi
            echo "::warning::Downloading the build tools failed (try $try of 3), trying again in 20 seconds"
            sleep 20
          done
          exit 1

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RAW_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          missing=""
          [ -z "$KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_B64"
          [ -z "$RAW_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASS"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty repository secret:$missing. Add it under Settings -> Secrets and variables -> Actions -> Secrets (Repository secrets, exact name; not a Variable or an Environment secret)."
            exit 1
          fi
          # pasted secrets often carry spaces, line breaks or quotes: take them off
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/dex-art.jks"
          PASS=$(printf '%s' "$RAW_PASS" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^["'"'"'`]//' -e 's/["'"'"'`]$//')
          echo "::add-mask::$PASS"
          if ! keytool -list -keystore "$RUNNER_TEMP/dex-art.jks" -storepass "$PASS" >/dev/null 2>&1; then
            echo "::error::The password in ANDROID_KEYSTORE_PASS does not open the key in ANDROID_KEYSTORE_B64 (the password secret has ${#PASS} characters). Paste the password again, exactly, without anything around it."
            exit 1
          fi
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
          echo "Signing key and password match."

      - name: Build
        env:
          KEYSTORE: ${{ runner.temp }}/dex-art.jks
          VERSION_NAME: '1.0'
        run: bash android/build.sh # bash: works even when the file lost its run permission in an upload

      - uses: actions/upload-artifact@v4
        with:
          name: dex-art-apk
          path: android/dist/dex-art.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(git rev-list --count HEAD)
          printf '{"code":%s,"name":"1.0","built":"%s"}\n' "$CODE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > android/dist/version.json
          # one release that is replaced every time, so .../releases/latest/download/dex-art.apk is always the newest
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest android/dist/dex-art.apk android/dist/version.json \
            --title "Android app (build $CODE)" --notes "Install dex-art.apk on your phone. The app checks for updates by itself." --latest
